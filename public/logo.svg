<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Tablet (Minimal modern kitchen screen) -->
  <!-- Outer shell / frame -->
  <rect
    x="10"
    y="8"
    width="34"
    height="46"
    rx="6"
    fill="#F4EFEA"
    stroke="#1E3A2B"
    stroke-width="2.5"
  />

  <!-- Tablet camera dot -->
  <circle cx="27" cy="12.5" r="1" fill="#1E3A2B" />

  <!-- Minimal screen content lines -->
  <!-- Header bar -->
  <rect x="15" y="17" width="14" height="3" rx="1.5" fill="#1E3A2B" />
  <!-- UI lines -->
  <line x1="15" y1="25" x2="36" y2="25" stroke="#9BB2A3" stroke-width="2" stroke-linecap="round" />
  <line x1="15" y1="30" x2="32" y2="30" stroke="#9BB2A3" stroke-width="2" stroke-linecap="round" />
  <line x1="15" y1="35" x2="24" y2="35" stroke="#9BB2A3" stroke-width="2" stroke-linecap="round" />

  <!-- Negative space cutout buffer around tomato so it separates cleanly from tablet -->
  <circle cx="43" cy="43" r="16.5" fill="#FAF7F2" />

  <!-- Minimalist Tomato -->
  <!-- Tomato main sphere -->
  <circle cx="43" cy="43" r="13.5" fill="#E2442F" />

  <!-- Subtle modern flat shadow on lower right -->
  <path
    d="M 43,56.5 C 50.45,56.5 56.5,50.45 56.5,43 C 56.5,41.2 56.14,39.5 55.5,37.9 C 53.5,47.5 45.5,54.5 35.8,55.5 C 38,56.14 40.4,56.5 43,56.5 Z"
    fill="#C73421"
  />

  <!-- Minimalist specular gloss curve -->
  <path
    d="M 37,35 A 8 8 0 0 1 44,32"
    stroke="#FFFFFF"
    stroke-width="2.2"
    stroke-linecap="round"
    opacity="0.85"
  />

  <!-- Minimalist Tomato Calyx & Stem -->
  <!-- Calyx leaves (crisp, modern star shape) -->
  <path
    d="M 43,29.5 
       C 40.5,27 37.5,27.5 36.5,28 
       C 38.5,30 40.5,30.5 42,30.5 
       L 41,33 
       L 43.5,31 
       L 46,33 
       L 45,30.5 
       C 46.5,30.5 48.5,30 50.5,28 
       C 49.5,27.5 46.5,27 44,29.5 
       Z"
    fill="#1E3A2B"
  />

  <!-- Stem curving upwards -->
  <path
    d="M 43.5,29.5 C 43.2,26 44.5,23.5 47,22.5"
    stroke="#1E3A2B"
    stroke-width="2"
    stroke-linecap="round"
    fill="none"
  />
</svg>
